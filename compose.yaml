services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/events.sqlite
      UPLOAD_DIR: /data/uploads
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
      BOT_USERNAME: ${BOT_USERNAME:-t280_hakaton_max_bot}
      BOT_TOKEN: ${BOT_TOKEN:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_URL: ${AI_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-}
    ports:
      - "3001:3001"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /backend
        VITE_USE_MOCK: "false"
        VITE_BOT_USERNAME: ${BOT_USERNAME:-t280_hakaton_max_bot}
        # В браузере localhost нет MAX initData, поэтому для Docker-проверки
        # используем явную тестовую учётку. В production это нужно отключить.
        VITE_LOCAL_TEST_USER: ${VITE_LOCAL_TEST_USER:-true}
        VITE_LOCAL_USER_ID: ${VITE_LOCAL_USER_ID:-local-reviewer}
        VITE_LOCAL_USER_NAME: ${VITE_LOCAL_USER_NAME:-Проверяющий}
        VITE_LOCAL_USER_CITY: ${VITE_LOCAL_USER_CITY:-Казань}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  app-data:
