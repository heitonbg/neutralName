# DATA-API 1.0
# Здесь не должно быть паролей, токенов, API-ключей и реальных персональных данных.
# Роли в проверках обозначают только участников сценария; они не проверяются API.
# Тесты, меняющие данные, запускайте только на изолированном тестовом сервере.

schemaVersion: "1.0"

solution:
  name: "Вместе"

api:
  baseUrl: "https://maxserver-iwrawww.amvera.io"
  openapi: "./openapi.yaml"

checks:
  - id: health
    name: "Проверка доступности API"
    method: GET
    path: /health
    role: public
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields:
        - status
        - eventsCount
        - usersCount
        - seeded
        - timestamp
      bodySchema:
        type: object
        properties:
          status:
            const: ok
          eventsCount:
            type: integer
            minimum: 0
          usersCount:
            type: integer
            minimum: 0
          seeded:
            type: boolean
          timestamp:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: list-events
    name: "Получение ленты событий"
    method: GET
    path: /api/events
    role: public
    expected:
      statusCodes: [200]
      contentType: application/json
      bodySchema:
        type: array
        items:
          type: object
          required:
            - id
            - title
            - category
            - date
            - price
            - participants
          properties:
            id:
              type: integer
            title:
              type: string
            category:
              type: string
            date:
              type: string
            price:
              type: string
            participants:
              type: integer
    timeoutMs: 5000
    repeatable: true

  - id: bootstrap-anonymous
    name: "Получение стартового состояния без пользователя"
    method: GET
    path: /api/bootstrap
    role: public
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [user, joinedIds, participatedIds, createdIds]
      bodySchema:
        type: object
        required: [user, joinedIds, participatedIds, createdIds]
        properties:
          user:
            type: "null"
          joinedIds:
            type: array
          participatedIds:
            type: array
          createdIds:
            type: array
    timeoutMs: 5000
    repeatable: true

  - id: list-user-events
    name: "Получение текущих участий тестового пользователя"
    method: GET
    path: /api/events/joined
    role: public
    request:
      query:
        userId: data-api-test-participant
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [eventIds]
      bodySchema:
        type: object
        required: [eventIds]
        properties:
          eventIds:
            type: array
            items:
              type: integer
    timeoutMs: 5000
    repeatable: true

  - id: list-participated-events
    name: "Получение истории участий тестового пользователя"
    method: GET
    path: /api/events/participated
    role: public
    request:
      query:
        userId: data-api-test-participant
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [eventIds]
      bodySchema:
        type: object
        required: [eventIds]
        properties:
          eventIds:
            type: array
            items:
              type: integer
    timeoutMs: 5000
    repeatable: true

  - id: search-users
    name: "Поиск пользователей"
    method: GET
    path: /api/users/search
    role: public
    request:
      query:
        q: data-api-no-such-user-6f15a
        userId: data-api-test-participant
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [users]
      bodySchema:
        type: object
        required: [users]
        properties:
          users:
            type: array
    timeoutMs: 5000
    repeatable: true

  - id: read-missing-user
    name: "Проверка ответа для отсутствующего профиля"
    method: GET
    path: /api/users/{userId}
    role: public
    request:
      path:
        userId: data-api-no-such-user-6f15a
    expected:
      statusCodes: [404]
      contentType: application/json
      requiredFields: [error]
      bodySchema:
        type: object
        required: [error]
        properties:
          error:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: read-test-friends
    name: "Получение списка друзей тестового пользователя"
    method: GET
    path: /api/friends
    role: public
    request:
      query:
        userId: data-api-test-friend-requester
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [friends, incoming, outgoing]
      bodySchema:
        type: object
        required: [friends, incoming, outgoing]
        properties:
          friends:
            type: array
          incoming:
            type: array
          outgoing:
            type: array
    timeoutMs: 5000
    repeatable: true

  - id: request-friend
    name: "Создание тестовой заявки в друзья"
    description: "Создаёт заявку между синтетическими ID; она удаляется шагом cleanup."
    method: POST
    path: /api/friends/request
    role: test-user
    request:
      headers:
        Content-Type: application/json
      body:
        fromId: data-api-test-friend-requester
        toId: data-api-test-friend-recipient
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [status]
      bodySchema:
        type: object
        required: [status]
        properties:
          status:
            const: outgoing
    timeoutMs: 5000
    repeatable: false

  - id: read-friend-request-status
    name: "Проверка статуса тестовой заявки в друзья"
    method: GET
    path: /api/friends/status
    role: public
    dependsOn: [request-friend]
    request:
      query:
        userId: data-api-test-friend-requester
        otherId: data-api-test-friend-recipient
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [status]
      bodySchema:
        type: object
        required: [status]
        properties:
          status:
            const: outgoing
    timeoutMs: 5000
    repeatable: true

  - id: search-cities-short-query
    name: "Проверка ответа поиска городов на короткий запрос"
    method: GET
    path: /api/cities/search
    role: public
    request:
      query:
        q: x
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [cities, sources]
      bodySchema:
        type: object
        required: [cities, sources]
        properties:
          cities:
            type: array
          sources:
            type: array
    timeoutMs: 5000
    repeatable: true

  - id: search-address-short-query
    name: "Проверка ответа поиска адреса на короткий запрос"
    method: GET
    path: /api/cities/address
    role: public
    request:
      query:
        q: x
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [addresses]
      bodySchema:
        type: object
        required: [addresses]
        properties:
          addresses:
            type: array
    timeoutMs: 5000
    repeatable: true

  - id: reverse-geocode-validates-coordinates
    name: "Проверка валидации координат обратного геокодирования"
    method: GET
    path: /api/cities/reverse
    role: public
    expected:
      statusCodes: [400]
      contentType: application/json
      requiredFields: [error]
      bodySchema:
        type: object
        required: [error]
        properties:
          error:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: check-clean-text
    name: "Проверка модерации допустимого текста"
    method: POST
    path: /api/moderation/check
    role: public
    request:
      headers:
        Content-Type: application/json
      body:
        text: "Прогулка по парку"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [isClean]
      bodySchema:
        type: object
        required: [isClean]
        properties:
          isClean:
            const: true
    timeoutMs: 5000
    repeatable: true

  - id: tourist-plans-require-authentication
    name: "Проверка защиты туристических планов"
    method: GET
    path: /api/tourist/plans
    role: unauthenticated
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error, code]
      bodySchema:
        type: object
        required: [error, code]
        properties:
          error:
            type: string
          code:
            const: MAX_AUTH_HEADER_MISSING
    timeoutMs: 5000
    repeatable: true

  - id: tourist-places-require-event
    name: "Проверка обязательности события для поиска туристических мест"
    method: POST
    path: /api/tourist/places
    role: public
    request:
      headers:
        Content-Type: application/json
      body:
        eventIds: []
    expected:
      statusCodes: [400]
      contentType: application/json
      requiredFields: [error]
      bodySchema:
        type: object
        required: [error]
        properties:
          error:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: tourist-place-search-validates-query
    name: "Проверка обязательного запроса поиска туристических мест"
    method: POST
    path: /api/tourist/search-places
    role: public
    request:
      headers:
        Content-Type: application/json
      body:
        query: x
        eventIds: []
    expected:
      statusCodes: [400]
      contentType: application/json
      requiredFields: [error]
      bodySchema:
        type: object
        required: [error]
        properties:
          error:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: create-event
    name: "Создание тестового события организатором"
    description: "Создаёт будущее тестовое событие; удаляется шагом cleanup."
    method: POST
    path: /api/events
    role: organizer
    request:
      headers:
        Content-Type: application/json
      body:
        title: "DATA-API тестовое событие"
        description: "Временное событие для проверки API."
        category: "Прогулка"
        date: "2099-06-01, 12:00"
        duration: "1 ч"
        format: "Онлайн"
        price: "Бесплатно"
        city: "Казань"
        maxParticipants: 10
        organizerId: data-api-test-organizer
    expected:
      statusCodes: [201]
      contentType: application/json
      requiredFields:
        - id
        - title
        - organizerId
        - participants
      bodySchema:
        type: object
        required:
          - id
          - title
          - organizerId
          - participants
        properties:
          id:
            type: integer
          title:
            const: "DATA-API тестовое событие"
          organizerId:
            const: data-api-test-organizer
          participants:
            type: integer
    timeoutMs: 5000
    repeatable: false
    extract:
      eventId: "$.id"

  - id: read-created-event
    name: "Чтение созданного события"
    method: GET
    path: /api/events/{eventId}
    role: public
    dependsOn:
      - create-event
    request:
      path:
        eventId: "${eventId}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields:
        - id
        - title
        - organizerId
        - participants
      bodySchema:
        type: object
        required:
          - id
          - title
          - organizerId
          - participants
        properties:
          id:
            type: integer
          title:
            const: "DATA-API тестовое событие"
          organizerId:
            const: data-api-test-organizer
          participants:
            type: integer
    timeoutMs: 5000
    repeatable: true

  - id: read-event-participants
    name: "Получение участников созданного события"
    method: GET
    path: /api/events/{eventId}/participants
    role: public
    dependsOn: [create-event]
    request:
      path:
        eventId: "${eventId}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [participants]
      bodySchema:
        type: object
        required: [participants]
        properties:
          participants:
            type: array
            items:
              type: object
              required: [id, isOrganizer]
              properties:
                id:
                  type: string
                isOrganizer:
                  type: boolean
    timeoutMs: 5000
    repeatable: true

  - id: read-event-reviews
    name: "Получение отзывов будущего события"
    method: GET
    path: /api/events/{eventId}/reviews
    role: public
    dependsOn: [create-event]
    request:
      path:
        eventId: "${eventId}"
    expected:
      statusCodes: [200]
      contentType: application/json
      bodySchema:
        type: array
    timeoutMs: 5000
    repeatable: true

  - id: reject-review-for-future-event
    name: "Запрет отзыва до завершения события"
    method: POST
    path: /api/events/{eventId}/reviews
    role: participant
    dependsOn: [create-event]
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: application/json
      body:
        userId: data-api-test-participant
        rating: 5
        text: "Тестовый отзыв до завершения события"
    expected:
      statusCodes: [403]
      contentType: application/json
      requiredFields: [error]
      bodySchema:
        type: object
        required: [error]
        properties:
          error:
            type: string
    timeoutMs: 5000
    repeatable: true

  - id: join-event
    name: "Запись участника на событие"
    method: POST
    path: /api/events/{eventId}/join
    role: participant
    dependsOn:
      - create-event
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: application/json
      body:
        userId: data-api-test-participant
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields:
        - success
        - participants
      bodySchema:
        type: object
        required:
          - success
          - participants
        properties:
          success:
            const: true
          participants:
            const: 2
    timeoutMs: 5000
    repeatable: false

  - id: leave-event
    name: "Отмена участия в событии"
    method: POST
    path: /api/events/{eventId}/leave
    role: participant
    dependsOn:
      - join-event
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: application/json
      body:
        userId: data-api-test-participant
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields:
        - success
        - participants
      bodySchema:
        type: object
        required:
          - success
          - participants
        properties:
          success:
            const: true
          participants:
            const: 1
    timeoutMs: 5000
    repeatable: false

  - id: update-event
    name: "Изменение события организатором"
    method: PUT
    path: /api/events/{eventId}
    role: organizer
    dependsOn:
      - create-event
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: application/json
      body:
        userId: data-api-test-organizer
        title: "DATA-API тестовое событие — обновлено"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields:
        - id
        - title
        - organizerId
        - updatedAt
      bodySchema:
        type: object
        required:
          - id
          - title
          - organizerId
          - updatedAt
        properties:
          id:
            type: integer
          title:
            const: "DATA-API тестовое событие — обновлено"
          organizerId:
            const: data-api-test-organizer
          updatedAt:
            type: string
    timeoutMs: 5000
    repeatable: false

cleanup:
  - id: delete-test-event
    method: DELETE
    path: /api/events/{eventId}
    role: organizer
    request:
      path:
        eventId: "${eventId}"
      query:
        userId: data-api-test-organizer
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000

  - id: cancel-test-friend-request
    method: POST
    path: /api/friends/decline
    role: test-user
    request:
      headers:
        Content-Type: application/json
      body:
        userId: data-api-test-friend-requester
        fromId: data-api-test-friend-recipient
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [status]
      bodySchema:
        type: object
        required: [status]
        properties:
          status:
            const: none
    timeoutMs: 5000
